# =============================================================================
# RubyLingo — CI (GitHub Actions). Cổng kiểm chạy trên MỌI push vào `main` và mọi pull_request.
# =============================================================================
#
# ⭐ VÌ SAO HAI JOB TÁCH RỜI (không gộp làm một):
#   • `ci`           — cổng kiểm của DỰ ÁN, y hệt `npm run ci` mà lập trình viên chạy ở máy
#                      (typecheck + lint + validate:content + gen + test). Đây là thứ chặn code sai.
#   • `docker-image` — cổng kiểm của ĐƯỜNG DEPLOY: `docker build` phải xanh TRÊN CI, không chỉ
#                      trên VPS. Nhờ nó, lỗi `COPY failed: file not found` (thiếu tệp trong build
#                      context) lộ ra ở PR thay vì để lộ lúc deploy — đúng lúc người dùng đang chờ.
#
# ⚠️⚠️ VÌ SAO KHÔNG CÀI python3/make/g++ CHO MODULE NATIVE:
#   `better-sqlite3` và `@node-rs/argon2` là module NATIVE. `ubuntu-latest` dùng glibc, và hai gói
#   này phát hành bản dựng sẵn cho linux-x64-gnu ⇒ `npm ci` tải bản prebuilt về là chạy, KHÔNG cần
#   biên dịch. Thêm bước cài toolchain sẽ (a) làm CI chậm, và (b) tệ hơn — che mất một lỗi thật:
#   nếu prebuilt đổi, ta MUỐN thấy nó đỏ ĐỂ BIẾT MÀ XỬ LÝ, chứ không phải để nó tự build lại trong
#   im lặng. ⇒ Cố ý KHÔNG thêm bước cài toolchain.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Huỷ run CŨ khi có commit MỚI trên cùng một nhánh. Không có mục này, một run cũ "xanh" có thể
# làm bạn tưởng commit mới cũng xanh, trong khi run mới còn đang xếp hàng.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Cổng kiểm dự án (npm run ci)
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      # ⚠️⚠️ CHỐT BIT THỰC THI — ĐẶT NGAY ĐẦU ĐỂ ĐỎ THẬT NHANH, VÀ VÌ SAO NÓ CẦN THIẾT:
      #   Máy dev là **Windows**, nơi `core.filemode=false` (NTFS không có bit thực thi kiểu Unix).
      #   Hệ quả: `git add` ghi các script là mode **100644**, và VPS Linux `git clone` về sẽ nhận
      #   `scripts/deploy.sh` **KHÔNG chạy được** ⇒ `./scripts/deploy.sh` báo:
      #       bash: ./scripts/deploy.sh: Permission denied
      #   Đây là lỗi HOÀN TOÀN IM LẶNG ở phía máy dev: đĩa vẫn hiện `-rwxr-xr-x`, `npm run ci` vẫn
      #   xanh, `bash scripts/deploy.sh` (gọi qua `bash`, không cần bit `x`) vẫn chạy — chỉ tới khi
      #   chạy ĐÚNG cách trên VPS mới lộ. Đã xảy ra thật một lần với CẢ BỐN script.
      #   Cách sửa: `git update-index --chmod=+x scripts/*.sh` — đổi mode TRONG INDEX, KHÔNG phải
      #   `chmod` trên đĩa (chmod trên Windows không đi vào git).
      #   ⚠️ Kiểm bằng `test -x` (kết quả THẬT sau khi checkout) chứ không chỉ đọc index: đó mới là
      #      thứ VPS thực sự nhận được.
      #   ⚠️ Cổng này quét CẢ script QA trong `docs/qa-t082/` — không chỉ `scripts/*.sh`.
      #      Lý do: bài học trên áp dụng cho MỌI script người thật sẽ gõ trực tiếp, bất kể nó nằm ở
      #      đâu. Khi thêm script mới vào `docs/`, hãy thêm vào danh sách dưới ĐÂY, nếu không nó
      #      sẽ mất bit `x` một cách im lặng y hệt bốn script `.sh` năm nào.
      #      `[ -e "$f" ] || continue` để mẫu không khớp cũng không làm đỏ oan (glob không khớp thì
      #      bash giữ nguyên chuỗi mẫu, và `test -x` trên chuỗi đó sẽ sai).
      - name: Kiểm bit thực thi của script
        run: |
          fail=0
          for f in scripts/*.sh docs/qa-t082/*.mjs; do
            [ -e "$f" ] || continue
            if [ -x "$f" ]; then
              echo "  ✓ $f"
            else
              echo "::error file=$f::$f thiếu bit thực thi sau khi checkout — VPS sẽ báo 'Permission denied'. Sửa bằng: git update-index --chmod=+x $f"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      # ⚠️⚠️ CHỐT "TỆP BẮT BUỘC PHẢI CÓ" — vì sao vẫn cần, dù `npm run ci` ở dưới cũng sẽ đỏ:
      #   Ngày 2026-10-09, `.gitignore` có mẫu `data/` THIẾU dấu `/` đầu. Mẫu không có `/` khớp ở
      #   MỌI ĐỘ SÂU, nên nó nuốt luôn `src/data/` — 17 tệp, gồm tầng dữ liệu và TOÀN BỘ nội dung
      #   từ vựng `src/data/levels/starters/**`. Bản clone sạch thiếu 17 tệp ⇒ `npm run typecheck`
      #   đỏ với "Cannot find module '../data/index.js'" — thông báo KHÔNG hề nhắc tới .gitignore,
      #   nên rất dễ đi sửa sai chỗ (đã suýt sửa nhầm vào test).
      #   Trên CI, `git status --ignored` KHÔNG giúp được: tệp bị ignore thì không có mặt để mà
      #   liệt kê. Nên ở đây ta kiểm sự HIỆN DIỆN của những tệp đã biết là bắt buộc, để lỗi hiện
      #   ra kèm ĐÚNG nguyên nhân thay vì một lỗi typecheck khó hiểu.
      - name: Chốt — tệp bắt buộc phải có trong bản checkout
        run: |
          thieu=0
          for p in src/data/index.ts src/data/avatars.ts src/data/xp-levels.ts \
                   src/data/global-scenes.ts src/data/word-assets.json \
                   src/data/levels/starters/level.json shared/content/content-index.json \
                   src/styles/tokens.css package-lock.json Dockerfile .env.example; do
            if [ -f "$p" ]; then
              echo "  ✓ $p"
            else
              echo "::error file=$p::$p THIẾU trong bản clone sạch. Nguyên nhân thường gặp: một mẫu trong .gitignore thiếu dấu '/' đầu dòng nên khớp ở mọi độ sâu (vd 'data/' nuốt luôn 'src/data/'). Kiểm bằng: git check-ignore -v $p"
              thieu=1
            fi
          done
          [ "$thieu" -eq 0 ] || exit 1

      - name: Cài Node 20 (có cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` (không phải `npm install`): cài ĐÚNG theo package-lock.json, tất định, và là
      # điều kiện để bước canh lệch bên dưới nói được điều gì đó về môi trường thật.
      - name: Cài phụ thuộc
        run: npm ci

      - name: Chạy cổng kiểm của dự án
        run: npm run ci

      # ⚠️ CANH LỆCH TỆP SINH TỰ ĐỘNG — và vì sao bước này KHÔNG đỏ giả:
      #   `npm run ci` chạy `gen:content-index` và `gen:theme-colors`. Hai script đó là NGUỒN của
      #   `shared/content/content-index.json` và `src/styles/tokens.css`.
      #   Đã ĐỌC CẢ HAI script để kiểm: đầu ra của chúng KHÔNG chứa dấu thời gian / ngày / hash
      #   ngẫu nhiên — chúng sắp khoá theo alphabet và tô màu bằng công thức CIE L* thuần tuý.
      #   ⇒ Chạy lại trên máy sạch cho ra tệp Y HỆT ⇒ `git diff` chỉ đỏ khi CÓ thật sự lệch.
      #   Đây là lớp canh THỨ HAI (lớp thứ nhất nằm trong chính hai generator, chế độ kiểm mặc
      #   định đã `exit 1` khi lệch): nó bắt trường hợp ai đó sửa TAY tệp sinh ra, hoặc một bước
      #   khác trong pipeline lỡ GHI ĐÈ lên tệp đang được theo dõi.
      - name: Canh lệch tệp sinh tự động
        run: git diff --exit-code -- shared/content/content-index.json src/styles/tokens.css

  docker-image:
    name: Build image (bảo vệ đường deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      # ⚠️ CHỈ BUILD. Cố ý KHÔNG thêm: `.env` (build không cần — `NODE_ENV` do compose đặt lúc
      #    chạy), `npm run ci` (đã có job `ci` ở trên, chạy lại là nhân đôi thời gian), và
      #    `docker compose up` (job này không chạy container — nó không kiểm app, mà kiểm IMAGE).
      #   Một mình `docker build` đã bắt được lỗi tốn kém nhất của đường deploy: thiếu tệp trong
      #   build context (`COPY failed: file not found`). Và bước TỰ KIỂM số lượng migration trong
      #   Dockerfile (`RUN test "$(ls -1 ./dist-server/migrations/*.sql | wc -l)" -eq "$(cat
      #   /tmp/migrations-count.txt)"`) chạy NGAY Ở ĐÂY ⇒ image thiếu `.sql` đỏ TRÊN CI, không
      #   phải đỏ lúc deploy trên VPS.
      - name: docker build
        run: docker build -t rubylingo:ci .
