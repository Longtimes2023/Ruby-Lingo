# =============================================================================
# RubyLingo — CI (GitHub Actions). Cổng kiểm chạy trên MỌI push vào `main` và mọi pull_request.
# =============================================================================
#
# ⭐ VÌ SAO BA JOB TÁCH RỜI (không gộp làm một):
#   • `ci`           — cổng kiểm của DỰ ÁN, y hệt `npm run ci` mà lập trình viên chạy ở máy
#                      (typecheck + lint + validate:content + gen + test), CỘNG bốn chốt hạ tầng
#                      (bit thực thi, tệp bắt buộc, biến bắt buộc, TỰ KIỂM `deploy.sh`) và cổng
#                      kiểm tệp workflow.
#                      Đây là thứ chặn code sai.
#   • `e2e`          — cổng kiểm ĐẦU-CUỐI: Chromium thật, HTTP thật, cookie thật, 3 viewport.
#                      Đây là tầng DUY NHẤT chứng minh app chạy được, vì unit test chạy trên jsdom
#                      (không render CSS, không router thật, không cookie).
#   • `docker-image` — cổng kiểm của ĐƯỜNG DEPLOY: `docker build` phải xanh TRÊN CI, không chỉ
#                      trên VPS. Nhờ nó, lỗi `COPY failed: file not found` (thiếu tệp trong build
#                      context) lộ ra ở PR thay vì để lộ lúc deploy — đúng lúc người dùng đang chờ.
#
# ⚠️⚠️ VÌ SAO KHÔNG CÀI python3/make/g++ CHO MODULE NATIVE:
#   `better-sqlite3` và `@node-rs/argon2` là module NATIVE. `ubuntu-latest` dùng glibc, và hai gói
#   này phát hành bản dựng sẵn cho linux-x64-gnu ⇒ `npm ci` tải bản prebuilt về là chạy, KHÔNG cần
#   biên dịch. Thêm bước cài toolchain sẽ (a) làm CI chậm, và (b) tệ hơn — che mất một lỗi thật:
#   nếu prebuilt đổi, ta MUỐN thấy nó đỏ ĐỂ BIẾT MÀ XỬ LÝ, chứ không phải để nó tự build lại trong
#   im lặng. ⇒ Cố ý KHÔNG thêm bước cài toolchain.
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Huỷ run CŨ khi có commit MỚI trên cùng một nhánh. Không có mục này, một run cũ "xanh" có thể
# làm bạn tưởng commit mới cũng xanh, trong khi run mới còn đang xếp hàng.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Cổng kiểm dự án (npm run ci)
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      # ⚠️⚠️ CỔNG KIỂM TỆP WORKFLOW — TỆP DUY NHẤT TRONG REPO TRƯỚC ĐÂY KHÔNG CÓ CỔNG NÀO PHỦ.
      #   `npm run ci` không đọc `.github/`; `js-yaml` chỉ bắt YAML hỏng cú pháp. Ba loại lỗi
      #   vẫn lọt qua, và cả ba đều khiến GitHub KHÔNG chạy job nào (hoặc chạy sai):
      #     • khoá sai chính tả trong một step (`withh:` thay vì `with:`) — YAML vẫn hợp lệ;
      #     • `needs:` trỏ tới job không tồn tại ⇒ workflow không hợp lệ;
      #     • biểu thức `${{ needs.x.y }}` sai ⇒ chỉ đỏ lúc chạy, không đỏ lúc đọc.
      #   Vì repo là PRIVATE, không có cách nào kiểm trước khi push — và đã có lần sửa chính tệp
      #   này làm rơi mất một dòng `- name:` mà chỉ phát hiện được nhờ parse lại thủ công.
      #
      #   ⚠️ VÌ SAO TẢI BẢN GHIM + KIỂM CHECKSUM, KHÔNG dùng action của bên thứ ba:
      #     (a) không thêm một phụ thuộc thực thi nữa vào đường CI; (b) phiên bản và mã băm nằm
      #     ngay trong tệp này nên đọc là thấy; (c) mã băm lấy từ `actionlint_1.7.12_checksums.txt`
      #     của chính bản phát hành đó ⇒ tệp tải về bị đổi thì bước này ĐỎ, chứ không âm thầm
      #     chạy một binary lạ.
      #   ⚠️ `shellcheck` 0.9.0 ĐÃ CÓ SẴN trong runner `ubuntu-24.04` ⇒ actionlint tự dùng nó để
      #     lint luôn các khối `run:` của workflow, KHÔNG cần cài thêm gì.
      #   ⚠️ Chạy KHÔNG kèm đường dẫn tệp ⇒ actionlint tự quét MỌI workflow trong repo, nên tệp
      #     thêm sau này cũng được canh mà không phải sửa bước này.
      #   ⚠️ Đã kiểm ở máy (bản Windows, cùng shellcheck 0.9.0): actionlint bắt đúng 3 lỗi tiêm
      #     thử (khoá lạ, `needs` không tồn tại, thuộc tính `needs.*` sai) ⇒ cổng này thật sự có
      #     tác dụng, không phải "xanh cho vui".
      - name: Kiểm tệp workflow (actionlint)
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint

      # ⚠️⚠️ CHỐT BIT THỰC THI — ĐẶT NGAY ĐẦU ĐỂ ĐỎ THẬT NHANH, VÀ VÌ SAO NÓ CẦN THIẾT:
      #   Máy dev là **Windows**, nơi `core.filemode=false` (NTFS không có bit thực thi kiểu Unix).
      #   Hệ quả: `git add` ghi các script là mode **100644**, và VPS Linux `git clone` về sẽ nhận
      #   `scripts/deploy.sh` **KHÔNG chạy được** ⇒ `./scripts/deploy.sh` báo:
      #       bash: ./scripts/deploy.sh: Permission denied
      #   Đây là lỗi HOÀN TOÀN IM LẶNG ở phía máy dev: đĩa vẫn hiện `-rwxr-xr-x`, `npm run ci` vẫn
      #   xanh, `bash scripts/deploy.sh` (gọi qua `bash`, không cần bit `x`) vẫn chạy — chỉ tới khi
      #   chạy ĐÚNG cách trên VPS mới lộ. Đã xảy ra thật một lần với CẢ BỐN script.
      #   Cách sửa: `git update-index --chmod=+x scripts/*.sh` — đổi mode TRONG INDEX, KHÔNG phải
      #   `chmod` trên đĩa (chmod trên Windows không đi vào git).
      #   ⚠️ Kiểm bằng `test -x` (kết quả THẬT sau khi checkout) chứ không chỉ đọc index: đó mới là
      #      thứ VPS thực sự nhận được.
      #   ⚠️ Cổng này quét CẢ script QA trong `docs/qa-t082/` — không chỉ `scripts/*.sh`.
      #      Lý do: bài học trên áp dụng cho MỌI script người thật sẽ gõ trực tiếp, bất kể nó nằm ở
      #      đâu. Khi thêm script mới vào `docs/`, hãy thêm vào danh sách dưới ĐÂY, nếu không nó
      #      sẽ mất bit `x` một cách im lặng y hệt bốn script `.sh` năm nào.
      #      (`scripts/tests/*.sh` đã được thêm sẵn khi tạo script tự kiểm — glob `scripts/*.sh`
      #      KHÔNG đệ quy, nên thư mục con phải được liệt kê riêng.)
      #      `[ -e "$f" ] || continue` để mẫu không khớp cũng không làm đỏ oan (glob không khớp thì
      #      bash giữ nguyên chuỗi mẫu, và `test -x` trên chuỗi đó sẽ sai).
      - name: Kiểm bit thực thi của script
        run: |
          fail=0
          for f in scripts/*.sh scripts/tests/*.sh docs/qa-t082/*.mjs; do
            [ -e "$f" ] || continue
            if [ -x "$f" ]; then
              echo "  ✓ $f"
            else
              echo "::error file=$f::$f thiếu bit thực thi sau khi checkout — VPS sẽ báo 'Permission denied'. Sửa bằng: git update-index --chmod=+x $f"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1

      # ⚠️⚠️ CHỐT "TỆP BẮT BUỘC PHẢI CÓ" — vì sao vẫn cần, dù `npm run ci` ở dưới cũng sẽ đỏ:
      #   Ngày 2026-10-09, `.gitignore` có mẫu `data/` THIẾU dấu `/` đầu. Mẫu không có `/` khớp ở
      #   MỌI ĐỘ SÂU, nên nó nuốt luôn `src/data/` — 17 tệp, gồm tầng dữ liệu và TOÀN BỘ nội dung
      #   từ vựng `src/data/levels/starters/**`. Bản clone sạch thiếu 17 tệp ⇒ `npm run typecheck`
      #   đỏ với "Cannot find module '../data/index.js'" — thông báo KHÔNG hề nhắc tới .gitignore,
      #   nên rất dễ đi sửa sai chỗ (đã suýt sửa nhầm vào test).
      #   Trên CI, `git status --ignored` KHÔNG giúp được: tệp bị ignore thì không có mặt để mà
      #   liệt kê. Nên ở đây ta kiểm sự HIỆN DIỆN của những tệp đã biết là bắt buộc, để lỗi hiện
      #   ra kèm ĐÚNG nguyên nhân thay vì một lỗi typecheck khó hiểu.
      - name: Chốt — tệp bắt buộc phải có trong bản checkout
        run: |
          thieu=0
          for p in src/data/index.ts src/data/avatars.ts src/data/xp-levels.ts \
                   src/data/global-scenes.ts src/data/word-assets.json \
                   src/data/levels/starters/level.json shared/content/content-index.json \
                   src/styles/tokens.css package-lock.json Dockerfile .env.example; do
            if [ -f "$p" ]; then
              echo "  ✓ $p"
            else
              echo "::error file=$p::$p THIẾU trong bản clone sạch. Nguyên nhân thường gặp: một mẫu trong .gitignore thiếu dấu '/' đầu dòng nên khớp ở mọi độ sâu (vd 'data/' nuốt luôn 'src/data/'). Kiểm bằng: git check-ignore -v $p"
              thieu=1
            fi
          done
          [ "$thieu" -eq 0 ] || exit 1

      # ⚠️⚠️ CHỐT "BIẾN BẮT BUỘC TRONG `.env.example`" — cùng họ với chốt TỆP ở trên, nhưng cho BIẾN.
      #   Bốn biến này là thứ `.env` trên VPS PHẢI có. `docker-compose.yml` dùng `${TÊN:?}` nên thiếu
      #   là `docker compose up` chết ngay — nhưng nếu ai đó XOÁ dòng khỏi `.env.example` thì người
      #   vận hành không còn biết phải điền gì, và lỗi sẽ hiện ra ở dạng khó hiểu TRÊN VPS — nơi đắt
      #   nhất để sửa. Chốt ở đây để nó lộ ra ngay ở PR.
      #
      #   ⚠️ VÌ SAO ĐÒI `^TÊN=` (GÁN THỰC SỰ) chứ không chỉ "tên có xuất hiện": một dòng bị COMMENT
      #      (`# SUBDOMAIN=`) vẫn CHỨA tên nhưng `.env` KHÔNG nạp nó ⇒ chốt kiểu "có xuất hiện" sẽ
      #      báo xanh trong khi VPS vẫn chết. Đã kiểm cả hai chiều: `.env.example` thật ⇒ 4/4 xanh;
      #      bản giả có `# SUBDOMAIN=` ⇒ ĐỎ đúng biến đó.
      #
      #   ⚠️ `SESSION_SECRET` nằm trong danh sách vì nó PHẢI được đổi giá trị khi deploy — không phải
      #      vì compose cần nó có mặt (compose đọc nó từ `.env`, và `${SESSION_SECRET:?}` đã bắt).
      - name: Chốt — biến bắt buộc trong `.env.example`
        run: |
          thieu=0
          for v in SUBDOMAIN DOMAIN_NAME TRAEFIK_CERTRESOLVER SESSION_SECRET; do
            if grep -qE "^${v}=" .env.example; then
              echo "  ✓ $v"
            else
              echo "::error file=.env.example::$v thiếu dòng gán '^${v}=' trong .env.example — người vận hành VPS sẽ không biết phải điền gì. LƯU Ý: dòng bị COMMENT KHÔNG được tính."
              thieu=1
            fi
          done
          [ "$thieu" -eq 0 ] || exit 1

      # ⚠️⚠️ TỰ KIỂM `scripts/deploy.sh` — CỔNG DUY NHẤT PHỦ ĐƯỢC LOẠI LỖI "SCRIPT THOÁT IM LẶNG".
      #   Ngày 2026-10-09, người dùng chạy `./scripts/deploy.sh` trên VPS: script in ra tới dòng
      #   `✓ cấu hình hợp lệ, URL công khai sẽ kiểm: https://…` rồi TRẢ VỀ DẤU NHẮC — không lỗi,
      #   không gợi ý. Anh ấy tưởng script treo và phải đi hỏi.
      #
      #   Nguyên nhân: `set -euo pipefail` + phép GÁN `VAR="$(… | grep -oE 'X=…' | head -n1)"`.
      #   `grep` không khớp ⇒ cả pipeline trả 1 ⇒ `set -e` coi phép gán là lệnh thất bại ⇒ **thoát
      #   ngay tại dòng đó, im lặng**; dòng `[ -n "$VAR" ] || fail …` ngay dưới thành MÃ CHẾT.
      #   Và `grep` không khớp vì `docker compose config` CHUẨN HOÁ `labels` sang dạng MAP (`k: v`,
      #   dấu `:`) trong khi mã cũ chỉ tìm dấu `=` — nhãn CÓ trong tệp, CÓ trong đầu ra, mà vẫn trượt.
      #
      #   ⚠️ VÌ SAO PHẢI CHẠY THẬT, KHÔNG THỂ LINT: `tsc`, `eslint`, `prettier`, `vitest` đều không
      #     mở tệp `.sh`; `actionlint` (bước trên) chỉ soi khối `run:` BÊN TRONG workflow, không soi
      #     script rời; `shellcheck` cũng KHÔNG có luật nào cho lớp lỗi này. Cách duy nhất là CHẠY
      #     script với một `docker` GIẢ rồi khẳng định trên đầu ra thật — đó là việc của script này.
      #   ⚠️ Không cần Docker, không cần mạng, không cần VPS: `docker` giả nằm trong $PATH tạm.
      #   ⚠️ Script tự đếm số khẳng định đỏ rồi mới quyết định mã thoát (nó CỐ Ý không dùng
      #     `set -e` — dùng `set -e` ở tầng kiểm chứng là mắc lại đúng cái bệnh đang đi bắt).
      #   ⚠️ Đã kiểm hai chiều ở máy trước khi đưa vào: bản CŨ của `deploy.sh` làm script này ĐỎ
      #     7 khẳng định (và tái hiện y hệt triệu chứng "dừng sau dòng ✓ cấu hình hợp lệ…"); bản
      #     ĐÃ SỬA ⇒ 14/14 xanh. Một cổng không từng đỏ là một cổng chưa được chứng minh.
      - name: Tự kiểm scripts/deploy.sh (bước 1 — chống thoát im lặng)
        run: bash scripts/tests/deploy-step1.test.sh

      - name: Cài Node 20 (có cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` (không phải `npm install`): cài ĐÚNG theo package-lock.json, tất định, và là
      # điều kiện để bước canh lệch bên dưới nói được điều gì đó về môi trường thật.
      - name: Cài phụ thuộc
        run: npm ci

      - name: Chạy cổng kiểm của dự án
        run: npm run ci

      # ⚠️ CANH LỆCH TỆP SINH TỰ ĐỘNG — và vì sao bước này KHÔNG đỏ giả:
      #   `npm run ci` chạy `gen:content-index` và `gen:theme-colors`. Hai script đó là NGUỒN của
      #   `shared/content/content-index.json` và `src/styles/tokens.css`.
      #   Đã ĐỌC CẢ HAI script để kiểm: đầu ra của chúng KHÔNG chứa dấu thời gian / ngày / hash
      #   ngẫu nhiên — chúng sắp khoá theo alphabet và tô màu bằng công thức CIE L* thuần tuý.
      #   ⇒ Chạy lại trên máy sạch cho ra tệp Y HỆT ⇒ `git diff` chỉ đỏ khi CÓ thật sự lệch.
      #   Đây là lớp canh THỨ HAI (lớp thứ nhất nằm trong chính hai generator, chế độ kiểm mặc
      #   định đã `exit 1` khi lệch): nó bắt trường hợp ai đó sửa TAY tệp sinh ra, hoặc một bước
      #   khác trong pipeline lỡ GHI ĐÈ lên tệp đang được theo dõi.
      - name: Canh lệch tệp sinh tự động
        run: git diff --exit-code -- shared/content/content-index.json src/styles/tokens.css

  # ⭐ JOB THỨ HAI — TẦNG DUY NHẤT CHỨNG MINH "APP CHẠY ĐƯỢC ĐẦU-CUỐI THẬT".
  #   Hai job còn lại đều KHÔNG chạy app trong trình duyệt: `ci` chạy unit test trên jsdom (không
  #   render CSS, không router thật, không HTTP, không cookie) và `docker-image` chỉ build. Ba loại
  #   lỗi vì thế lọt qua cả hai: (a) cookie phiên `httpOnly` không được set ⇒ mọi request sau đó
  #   thành ẩn danh; (b) guard định tuyến dựng sai ⇒ bé thấy màn trắng; (c) asset 404 ⇒ thẻ chủ đề
  #   trắng trơn. Playwright bắt đúng ba loại đó, trên Chromium thật, ở 3 viewport (360/820/1280).
  #
  # ⚠️ `needs: ci` — CỐ Ý. Tầng unit rẻ hơn và bắt lỗi nhanh hơn; nếu nó đỏ thì chạy e2e chỉ tốn
  #   thêm ~5 phút để kết luận cùng một điều.
  #
  # ⚠️⚠️ `timeout-minutes` — CỐ Ý, KHÔNG PHẢI CHO ĐẸP. Đã gặp THẬT trên máy dev: khi Playwright
  #   không tắt được webServer, tiến trình sống 18 phút SAU KHI test đã xong và lượt chạy không bao
  #   giờ in dòng tổng kết. Không có trần thời gian, sự cố như vậy trên CI sẽ treo job tới hạn mặc
  #   định của GitHub. Trần 20 phút biến "treo vô hạn" thành "đỏ sau 20 phút".
  #
  # ⚠️ VÌ SAO CHỈ CÀI `chromium`: cả 3 project đều dùng Chromium (`Desktop Chrome`). `--with-deps`
  #   kéo theo thư viện hệ thống mà Chromium cần (font, libnss, libgbm…); thiếu chúng thì Chromium
  #   chết lúc khởi động với lỗi khó đọc. KHÔNG cài firefox/webkit — chưa project nào dùng.
  #
  # ⚠️ VÌ SAO KHÔNG KHAI BIẾN MÔI TRƯỜNG Ở ĐÂY: mọi thứ server cần đã do `playwright.config.ts`
  #   cấp qua `webServer.env` (DB riêng `data/e2e.db`, cổng 4173, `PUBLIC_ORIGIN` khớp `baseURL`,
  #   `SESSION_SECRET` cho DB tạm). Bản clone sạch KHÔNG có `.env` mà vẫn chạy được:
  #   `server/db/connection.ts` tự `mkdirSync` thư mục `data/` (thư mục này bị `.gitignore` nên nó
  #   KHÔNG tồn tại trong bản clone).
  #
  # ⚠️⚠️ LUẬT SỐ 1 CỦA TẦNG NÀY: e2e TUYỆT ĐỐI KHÔNG ĐƯỢC CHẠM `data/rubylingo.db` — đó là DB chứa
  #   DỮ LIỆU THẬT CỦA TRẺ. Nó chạy trên `data/e2e.db`; xem khối chú thích đầu `playwright.config.ts`.
  e2e:
    name: Test đầu-cuối (Playwright · 3 viewport)
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 20
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node 20 (có cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cài phụ thuộc
        run: npm ci

      # Cache riêng cho trình duyệt. Khoá theo `package-lock.json` ⇒ khi `@playwright/test` đổi
      # phiên bản thì cache tự vô hiệu, không bao giờ chạy một Chromium lệch với thư viện.
      - name: Cache trình duyệt Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Cài Chromium
        run: npx playwright install --with-deps chromium

      # KHÔNG cần bước build riêng: `tests/e2e/serve.mjs` tự chạy `build:client` + `build:server`
      # TRƯỚC khi lên sóng ⇒ e2e luôn kiểm ĐÚNG mã đang có trên đĩa, không bao giờ kiểm `dist/` cũ.
      - name: Chạy test đầu-cuối
        run: npm run test:e2e

      # ⚠️ ẢNH + VẾT LỖI NẰM NGOÀI THƯ MỤC LÀM VIỆC — CỐ Ý (xem `playwright.config.ts`): `outputDir`
      #   trỏ vào thư mục TẠM của hệ điều hành để tránh lớp shim chặn xoá hàng loạt trên máy dev.
      #   Trên runner Ubuntu `os.tmpdir()` là `/tmp`, nên đường dẫn tải lên nằm ngoài repo.
      #   ⚠️ `rubylingo-e2e-build.log` là thứ DUY NHẤT nói được VÌ SAO build đỏ — `serve.mjs` ghi log
      #   build ra TỆP chứ không ra ống (đó chính là cách nó né lỗi `EBUSY` khi tạo ống).
      - name: Tải lên ảnh/vết lỗi khi đỏ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ket-qua
          path: |
            /tmp/rubylingo-e2e-results
            /tmp/rubylingo-e2e-build.log
          if-no-files-found: ignore
          retention-days: 7

  docker-image:
    name: Build image (bảo vệ đường deploy)
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      # ⚠️ CHỈ BUILD. Cố ý KHÔNG thêm: `.env` (build không cần — `NODE_ENV` do compose đặt lúc
      #    chạy), `npm run ci` (đã có job `ci` ở trên, chạy lại là nhân đôi thời gian), và
      #    `docker compose up` (job này không chạy container — nó không kiểm app, mà kiểm IMAGE).
      #   Một mình `docker build` đã bắt được lỗi tốn kém nhất của đường deploy: thiếu tệp trong
      #   build context (`COPY failed: file not found`). Và bước TỰ KIỂM số lượng migration trong
      #   Dockerfile (`RUN test "$(ls -1 ./dist-server/migrations/*.sql | wc -l)" -eq "$(cat
      #   /tmp/migrations-count.txt)"`) chạy NGAY Ở ĐÂY ⇒ image thiếu `.sql` đỏ TRÊN CI, không
      #   phải đỏ lúc deploy trên VPS.
      - name: docker build
        run: docker build -t rubylingo:ci .
